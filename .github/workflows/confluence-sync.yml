name: Sync ALL Confluence Spaces

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install confluence-markdown-exporter
        run: curl -LsSf https://uvx.sh/confluence-markdown-exporter/install.sh | sh

      - name: Export ALL Spaces
        env:
          # We map the Secrets to Environment Variables
          CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          # This tells the tool to run without an interactive menu
          CME_AUTH_USER: ${{ secrets.CONFLUENCE_USERNAME }}
          CME_AUTH_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CME_OUTPUT_PATH: ./wiki
        run: |
          # Use the URL secret directly in the command
          /home/runner/.local/bin/cme orgs "${{ secrets.CONFLUENCE_URL }}"
        
      - name: Commit and push changes
        uses: EndBug/add-and-commit@v9
        with:
          add: './wiki'
          message: 'docs: sync ALL Confluence spaces'
          default_author: github_actions
