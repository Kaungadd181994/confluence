name: Sync ALL Confluence Spaces
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install confluence-markdown-exporter
        run: curl -LsSf https://uvx.sh/confluence-markdown-exporter/install.sh | sh

      - name: Export ALL Spaces
        env:
          # These variable names (CME_AUTH_USER/TOKEN) are the standard way 
          # to pass credentials to the confluence-markdown-exporter tool
          CME_AUTH_USER: ${{ secrets.CONFLUENCE_USERNAME }}
          CME_AUTH_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          # We only provide the URL and the output path here
          /home/runner/.local/bin/cme orgs ${{ secrets.CONFLUENCE_URL }} \
            --output.path ./wiki
        
      - name: Commit and push changes
        uses: EndBug/add-and-commit@v9
        with:
          add: './wiki'
          message: 'docs: sync ALL Confluence spaces'
          default_author: github_actions
