name: Sync ALL Confluence Spaces
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Runs weekly

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install confluence-markdown-exporter
        run: curl -LsSf https://uvx.sh/confluence-markdown-exporter/install.sh | sh

      - name: Export ALL Spaces
        env:
          CME_AUTH_USER: ${{ secrets.CONFLUENCE_USERNAME }}
          CME_AUTH_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CME_OUTPUT_PATH: ./wiki
        run: |
          # The tool uses environment variables for Auth and Output Path
          # It only requires the Base URL as an argument
          /home/runner/.local/bin/cme orgs "${{ secrets.CONFLUENCE_URL }}"
        
      - name: Commit and push changes
        uses: EndBug/add-and-commit@v9
        with:
          add: './wiki'
          message: 'docs: sync ALL Confluence spaces'
          default_author: github_actions
