name: Sync ALL Confluence Spaces
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install confluence-markdown-exporter
        run: curl -LsSf https://uvx.sh/confluence-markdown-exporter/install.sh | sh

      - name: Export ALL Spaces
        env:
          # Create a config file that the tool reads automatically
          CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
          CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          # 1. Create a config directory
          mkdir -p ~/.config/confluence-markdown-exporter
          
          # 2. Write the credentials to the config file the tool expects
          cat <<EOF > ~/.config/confluence-markdown-exporter/config.json
          {
            "auth": {
              "confluence": {
                "user": "$CONFLUENCE_USERNAME",
                "token": "$CONFLUENCE_API_TOKEN"
              }
            },
            "output_path": "./wiki"
          }
          EOF
          
          # 3. Run the export without any flags
          /home/runner/.local/bin/cme orgs "$CONFLUENCE_URL"
        
      - name: Commit and push changes
        uses: EndBug/add-and-commit@v9
        with:
          add: './wiki'
          message: 'docs: sync ALL Confluence spaces'
          default_author: github_actions
