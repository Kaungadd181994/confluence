name: Sync ALL Confluence Spaces
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install confluence-markdown-exporter
        run: curl -LsSf https://uvx.sh/confluence-markdown-exporter/install.sh | sh

      - name: Export ALL Spaces
        env:
          # Force the tool to run without an interactive terminal
          CME_NON_INTERACTIVE: "1"
          # Standard auth variables
          CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          # Path configuration
          CME_OUTPUT_PATH: ./wiki
        run: |
          # Pass the credentials as a config file or directly via the environment
          # Using the --auth.user and --auth.token flags as a fallback for the CLI
          /home/runner/.local/bin/cme orgs "${{ secrets.CONFLUENCE_URL }}" \
            --auth.user "${{ secrets.CONFLUENCE_USERNAME }}" \
            --auth.token "${{ secrets.CONFLUENCE_API_TOKEN }}"
        
      - name: Commit and push changes
        uses: EndBug/add-and-commit@v9
        with:
          add: './wiki'
          message: 'docs: sync ALL Confluence spaces'
          default_author: github_actions
